server.port=8080
spring.application.name=SmartAttendanceBackend

# Firebase Configuration
firebase.config.path=classpath:firebase-service-account.json
firebase.database.url=https://centering-crowbar-qvr20.firebaseio.com

# Twilio SMS Configuration
twilio.account.sid=${TWILIO_ACCOUNT_SID:AC_mock_twilio_account_sid_sample}
twilio.auth.token=${TWILIO_AUTH_TOKEN:mock_twilio_auth_token_sample}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+18005552345}

# Email Configuration (JavaMailSender)
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY:mock_sendgrid_key_sample}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Low Attendance Alert Policy Thresholds
attendance.alert.warning-threshold=75
attendance.alert.critical-threshold=60
attendance.alert.cron=0 0 17 * * ?
